<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: var(--font-sans);
    color: var(--color-text-primary);
  }

  .header {
    padding: 1.5rem 1rem 0.5rem;
  }

  .header h2 {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .header p {
    font-size: 13px;
    color: var(--color-text-secondary);
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0.75rem 1rem;
  }

  .filter-btn {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--color-border-primary);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    cursor: pointer;
    transition: all .15s;
  }

  .filter-btn.active {
    background: var(--color-text-primary);
    color: var(--color-background-primary);
    border-color: var(--color-text-primary);
  }

  .list {
    padding: 0 1rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .building-row {
    border: 1px solid var(--color-border-tertiary);
    border-radius: 10px;
    overflow: hidden;
  }

  .building-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--color-background-secondary);
  }

  .building-header:hover {
    background: var(--color-background-tertiary);
  }

  .cat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .bname {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
  }

  .blevel {
    font-size: 11px;
    color: var(--color-text-tertiary);
    background: var(--color-background-tertiary);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .bcat {
    font-size: 11px;
    color: var(--color-text-secondary);
  }

  .upgrade-pill {
    font-size: 10px;
    color: var(--color-text-secondary);
    background: var(--color-background-tertiary);
    border: 1px solid var(--color-border-tertiary);
    padding: 2px 7px;
    border-radius: 10px;
  }

  .chevron {
    font-size: 12px;
    color: var(--color-text-tertiary);
    transition: transform .2s;
  }

  .building-body {
    display: none;
    padding: 12px 14px;
    border-top: 1px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
  }

  .building-body.open {
    display: block;
  }

  .prompt-text {
    font-size: 12px;
    color: var(--color-text-secondary);
    line-height: 1.6;
    font-family: var(--font-mono);
    background: var(--color-background-tertiary);
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .copy-btn {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
    color: var(--color-text-secondary);
    cursor: pointer;
  }

  .copy-btn:hover {
    background: var(--color-background-tertiary);
  }

  .copy-btn.copied {
    color: var(--color-text-success);
    border-color: var(--color-border-success);
  }

  .count {
    font-size: 12px;
    color: var(--color-text-tertiary);
    padding: 0 1rem 0.5rem;
  }
</style>

  let activeFilter = "All";

  function render() {
    const filtered = activeFilter === "All" ? buildings : buildings.filter(b => b.cat === activeFilter);
    document.getElementById("count").textContent = `${filtered.length} buildings`;
    document.getElementById("list").innerHTML = filtered.map((b, i) => {
      const color = CATS[b.cat] || "#888";
      const lvl = b.level ? `Lv ${b.level}` : "Quest";
      return `<div class="building-row" id="row-${i}">
      <div class="building-header" onclick="toggle(${i})">
        <span class="cat-dot" style="background:${color}"></span>
        <span class="bname">${b.name}</span>
        <span class="bcat">${b.cat}</span>
        <span class="blevel">${lvl}</span>
        ${b.upgrade ? `<span class="upgrade-pill">${b.upgrade}</span>` : ""}
        <span class="chevron" id="chev-${i}">▼</span>
      </div>
      <div class="building-body" id="body-${i}">
        <div class="prompt-text" id="pt-${i}">${b.prompt}</div>
        <button class="copy-btn" id="cb-${i}" onclick="copyPrompt(${i})">Copy prompt</button>
      </div>
    </div>`;
    }).join("");
  }

  function toggle(i) {
    const body = document.getElementById(`body-${i}`);
    const chev = document.getElementById(`chev-${i}`);
    const open = body.classList.toggle("open");
    chev.style.transform = open ? "rotate(180deg)" : "";
  }

  function copyPrompt(i) {
    const txt = document.getElementById(`pt-${i}`).textContent;
    navigator.clipboard.writeText(txt).then(() => {
      const btn = document.getElementById(`cb-${i}`);
      btn.textContent = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "Copy prompt"; btn.classList.remove("copied"); }, 1800);
    });
  }

  // Filters
  const cats = ["All", ...Object.keys(CATS)];
  document.getElementById("filters").innerHTML = cats.map(c =>
    `<button class="filter-btn ${c === "All" ? "active" : ""}" onclick="setFilter('${c}',this)">${c}</button>`
  ).join("");

  function setFilter(cat, el) {
    activeFilter = cat;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
    render();
  }

  render();
</script>
